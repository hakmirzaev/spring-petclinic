name: CI

on:
  push:
    branches: [ "dependability-project" ]
  pull_request:
    branches: [ "dependability-project" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build + tests + JaCoCo + PiTest
        run: |
          mvn -B -ntp clean test jacoco:report org.pitest:pitest-maven:mutationCoverage

      - name: Upload PiTest report (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: pitest-report
          path: target/pit-reports/
          if-no-files-found: error
          retention-days: 14
          

      - name: Upload JaCoCo report (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: error
          retention-days: 14